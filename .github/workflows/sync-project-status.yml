name: Sincronizar status e prazos do Project

# O painel (Roadmap) lê issues pela API pública, que não enxerga os campos
# do Project (isso exige login). Este workflow é a ponte: lê o Project via
# GraphQL (precisa do PROJECT_PAT — um token clássico com os escopos "repo"
# e "project"; o fine-grained não expõe permissão de Projects para conta
# pessoal, só para organização) e:
#   1. espelha o Status de cada item numa label da issue correspondente —
#      a mesma label que o Roadmap usa pra decidir a coluna;
#   2. publica início/término em timeline-data.json, a partir dos campos
#      "Start date" e "Target date" do Project — é esse arquivo que a aba
#      Linha do tempo do painel busca (mesma origem, sem login). Crie esses
#      dois campos de data no Project com esses nomes exatos; uma issue sem
#      os dois preenchidos simplesmente não entra no arquivo.
#   3. se o Project também tiver um campo numérico chamado "% Complete", o
#      valor dele vai junto em timeline-data.json como "pct". Sem esse campo
#      (ou sem valor numa issue), o painel calcula um % aproximado a partir
#      do Status (Backlog/Parado = 0%, Em andamento = 50%, Finalizado ou
#      Registrado no relatório = 100%) — crie o campo com esse nome exato
#      no Project quando quiser um % de verdade em vez da aproximação.
#   4. publica também "notas": o texto do último comentário da issue (se
#      houver), cortado em 400 caracteres. É a coluna Notas da tabela do
#      Acompanhamento — a ideia é usar o próprio comentário mais recente da
#      issue como observação, sem precisar de outro campo no Project.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler o Project, ajustar labels e publicar a linha do tempo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const fs = require('fs');
            const OWNER = 'jgdbeck';
            const REPO = 'painel-djud';
            const PROJECT_NUMBER = 1;
            // Precisa bater exatamente com os nomes das colunas do Project.
            const STATUS_LABELS = ['Backlog', 'Parado', 'Em andamento', 'Finalizado', 'Registrado no relatório'];

            async function fetchItems() {
              let items = [];
              let cursor = null;
              for (;;) {
                const res = await github.graphql(
                  `query($login:String!, $number:Int!, $cursor:String) {
                    user(login:$login) {
                      projectV2(number:$number) {
                        items(first:100, after:$cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            status: fieldValueByName(name:"Status") {
                              ... on ProjectV2ItemFieldSingleSelectValue { name }
                            }
                            inicio: fieldValueByName(name:"Start date") {
                              ... on ProjectV2ItemFieldDateValue { date }
                            }
                            termino: fieldValueByName(name:"Target date") {
                              ... on ProjectV2ItemFieldDateValue { date }
                            }
                            pct: fieldValueByName(name:"% Complete") {
                              ... on ProjectV2ItemFieldNumberValue { number }
                            }
                            content {
                              __typename
                              ... on Issue {
                                number
                                title
                                url
                                labels(first:50) { nodes { name } }
                                repository { name owner { login } }
                              }
                            }
                          }
                        }
                      }
                    }
                  }`,
                  { login: OWNER, number: PROJECT_NUMBER, cursor }
                );
                const conn = res.user.projectV2.items;
                items = items.concat(conn.nodes);
                if (!conn.pageInfo.hasNextPage) break;
                cursor = conn.pageInfo.endCursor;
              }
              return items;
            }

            const items = await fetchItems();
            let changed = 0;
            const timeline = [];
            for (const item of items) {
              const c = item.content;
              if (!c || c.__typename !== 'Issue') continue;
              if (c.repository.owner.login !== OWNER || c.repository.name !== REPO) continue;

              const desired = (item.status && STATUS_LABELS.includes(item.status.name)) ? item.status.name : 'Backlog';
              const current = c.labels.nodes.map(l => l.name);

              for (const name of current.filter(n => STATUS_LABELS.includes(n) && n !== desired)) {
                try {
                  await github.rest.issues.removeLabel({ owner: OWNER, repo: REPO, issue_number: c.number, name });
                  changed++;
                } catch (e) { core.warning(`remover "${name}" da #${c.number}: ${e.message}`); }
              }
              if (!current.includes(desired)) {
                await github.rest.issues.addLabels({ owner: OWNER, repo: REPO, issue_number: c.number, labels: [desired] });
                changed++;
              }

              if (item.inicio && item.inicio.date && item.termino && item.termino.date) {
                const registro = {
                  uid: String(c.number),
                  entregavel: c.title,
                  inicio: item.inicio.date,
                  termino: item.termino.date,
                  status: desired,
                  url: c.url,
                };
                if (item.pct && typeof item.pct.number === 'number') registro.pct = Math.max(0, Math.min(100, Math.round(item.pct.number)));
                try {
                  const { data: comentarios } = await github.rest.issues.listComments({ owner: OWNER, repo: REPO, issue_number: c.number, per_page: 100 });
                  if (comentarios.length) registro.notas = comentarios[comentarios.length - 1].body.replace(/\s+/g, ' ').trim().slice(0, 400);
                } catch (e) { core.warning(`ler comentários da #${c.number}: ${e.message}`); }
                timeline.push(registro);
              }
            }
            core.info(`${items.length} itens do Project lidos, ${changed} ajuste(s) de label aplicado(s), ${timeline.length} com início/término definidos.`);

            timeline.sort((a, b) => a.inicio.localeCompare(b.inicio));
            const novo = JSON.stringify(timeline, null, 2) + '\n';
            const atual = fs.existsSync('timeline-data.json') ? fs.readFileSync('timeline-data.json', 'utf8') : null;
            if (novo !== atual) {
              fs.writeFileSync('timeline-data.json', novo);
              await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
              await exec.exec('git', ['config', 'user.email', 'github-actions[bot]@users.noreply.github.com']);
              await exec.exec('git', ['add', 'timeline-data.json']);
              await exec.exec('git', ['commit', '-m', 'Atualizar timeline-data.json a partir do Project']);
              await exec.exec('git', ['push']);
            } else {
              core.info('timeline-data.json sem mudanças.');
            }
