name: Criar campo no Project

# Workflow manual e reutilizável: cria um campo no Project (nº 1) com o nome e
# tipo informados, se ele ainda não existir. Rode em Actions > Criar campo no
# Project > Run workflow, preenchendo "nome" (precisa bater exatamente com o
# que sync-project-status.yml espera) e "tipo".
on:
  workflow_dispatch:
    inputs:
      nome:
        description: 'Nome exato do campo (ex.: "URL do entregável")'
        required: true
        type: string
      tipo:
        description: 'Tipo do campo'
        required: true
        type: choice
        options: [TEXT, NUMBER, DATE]
        default: TEXT

jobs:
  criar-campo:
    runs-on: ubuntu-latest
    steps:
      - name: Criar o campo, se não existir
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const OWNER = 'jgdbeck';
            const PROJECT_NUMBER = 1;
            const NOME_CAMPO = ${{ toJSON(inputs.nome) }};
            const TIPO_CAMPO = ${{ toJSON(inputs.tipo) }};

            // field(name:"...") dá erro (não null) quando o campo não existe, então a
            // checagem precisa listar todos os campos e procurar pelo nome do lado de cá.
            const res = await github.graphql(
              `query($login:String!, $number:Int!) {
                user(login:$login) {
                  projectV2(number:$number) {
                    id
                    fields(first:100) { nodes { ... on ProjectV2FieldCommon { id name } } }
                  }
                }
              }`,
              { login: OWNER, number: PROJECT_NUMBER }
            );
            const proj = res.user.projectV2;
            const existente = proj.fields.nodes.find(f => f && f.name === NOME_CAMPO);

            if (existente) {
              core.info(`Campo "${NOME_CAMPO}" já existe (id ${existente.id}). Nada a fazer.`);
              return;
            }

            const criado = await github.graphql(
              `mutation($projectId:ID!, $nome:String!, $tipo:ProjectV2CustomFieldType!) {
                createProjectV2Field(input: {
                  projectId:$projectId, dataType:$tipo, name:$nome
                }) {
                  projectV2Field { ... on ProjectV2Field { id name } }
                }
              }`,
              { projectId: proj.id, nome: NOME_CAMPO, tipo: TIPO_CAMPO }
            );
            core.info(`Campo "${NOME_CAMPO}" (${TIPO_CAMPO}) criado (id ${criado.createProjectV2Field.projectV2Field.id}).`);
